# Intégration continue : lint, typecheck, tests, build, contrôles, parcours Playwright + axe.
# Aucun secret n'est nécessaire : le site est statique et les formulaires ne s'exécutent pas ici.
#
# **Deux jobs parallèles depuis le 12/10/2026 (D-073), et c'est une correction, pas un confort.**
# Un seul job enchaînait tout et dépassait son propre `timeout-minutes: 20` : l'exécution 38216421109
# sur `main` a été arrêtée à 20 min 20 s. Elle n'avait trouvé aucun défaut — elle n'avait pas eu le
# temps de finir. La cause est la taille de la suite de parcours : 788 tests (43 fichiers × deux
# projets, mobile et ordinateur), après l'installation, le build, les tests unitaires et les
# contrôles. Un délai dépassé se lit comme un échec dans la liste des exécutions, ce qui est le
# pire des deux mondes : l'alerte sans l'information.
#
# `verifier` porte les contrôles rapides ; `parcours` exécute les parcours en trois fractions
# parallèles (`--shard`). Les deux partent en même temps, donc le temps d'attente est celui du plus
# long, non leur somme.
name: CI

on:
  pull_request:
  push:
    # `main` seul laissait le travail de branche sans aucun signal : le dépôt du client montrait
    # encore, le 13/10/2026, l'échec du 04/10 comme dernier état connu, alors que neuf commits
    # avaient été poussés depuis sur une branche. Les branches de travail sont donc éprouvées
    # avant d'atteindre `main`, où il est trop tard pour apprendre quelque chose (D-081).
    # `feat/**` ajouté le 19/10 : la branche du portail n'était couverte par aucun déclencheur,
    # donc neuf commits y sont passés sans le moindre signal — exactement le trou que D-081
    # voulait fermer pour les autres branches.
    branches: [main, "phase/**", "claude/**", "feat/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  SITE_INDEXABLE: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  # L'adresse de l'API du CRM est inscrite dans le paquet au moment du build (`NEXT_PUBLIC_*`).
  # Ici, une adresse de test : les parcours du bureau interceptent les appels dans le navigateur,
  # aucune requête ne sort (voir tests/e2e/bureau.spec.ts).
  NEXT_PUBLIC_API_BASE_URL: "https://api.test.local"

jobs:
  verifier:
    name: Vérifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # La version vient du champ packageManager de package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Types Next.js (next-env.d.ts)
        run: pnpm exec next typegen

      - name: Audit des dépendances (bloquant au niveau critique)
        # docs/07 §6. Un avis « critical » arrête la CI : c'est exactement ce qui avait manqué pour
        # l'avis GHSA-vcvr-r3jv-pc5j sur next 16.3.5, resté invisible jusqu'à l'audit du 05/10.
        run: pnpm audit --audit-level critical

      - name: Avis de dépendances restants (informatif)
        # Les avis « high » et « moderate » sont affichés sans bloquer : les trois qui restent sont
        # dans l'outillage de développement et n'ont aucune version corrigée publiée (DC.2). Cette
        # étape devient bloquante dès qu'ils le sont.
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formatage
        run: pnpm format:check

      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Contrôles (pnpm validate)
        # Les sources externes sont informatives ici : plusieurs sites publics (dont
        # pour-les-personnes-agees.gouv.fr) répondent 404 aux exécuteurs de la CI pour des pages
        # vivantes, et la mort d'un lien n'est pas une propriété du commit. Elles sont éprouvées
        # strictement, une fois par semaine, par `.github/workflows/sources.yml`.
        run: pnpm validate
        env:
          YC_SOURCES_INFORMATIF: "1"

  parcours:
    name: Parcours (fraction ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Une fraction qui échoue ne masque pas les autres : on veut la liste complète des défauts
      # en une exécution, pas le premier d'entre eux.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Types Next.js (next-env.d.ts)
        run: pnpm exec next typegen

      - name: Mettre en cache le navigateur de Playwright
        # Le téléchargement de Chromium et de ses dépendances système coûte une à deux minutes par
        # fraction, soit trois fois par exécution. La clé porte la version de Playwright : une mise
        # à jour du paquet invalide le cache d'elle-même.
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Installer Chromium pour Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        # Les parcours tournent sur le build de production : `playwright.config.ts` démarre
        # `pnpm start`, qui exige un build présent.
        run: pnpm build

      - name: Parcours Playwright + axe
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Un nom par fraction : deux artefacts de même nom se refusent l'un l'autre.
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
