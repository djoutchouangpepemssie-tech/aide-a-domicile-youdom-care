# Intégration continue : lint, typecheck, tests, build, contrôles, parcours Playwright + axe.
# Aucun secret n'est nécessaire : le site est statique et les formulaires ne s'exécutent pas ici.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  SITE_INDEXABLE: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verifier:
    name: Vérifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # La version vient du champ packageManager de package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Types Next.js (next-env.d.ts)
        run: pnpm exec next typegen

      - name: Audit des dépendances (bloquant au niveau critique)
        # docs/07 §6. Un avis « critical » arrête la CI : c'est exactement ce qui avait manqué pour
        # l'avis GHSA-vcvr-r3jv-pc5j sur next 16.3.5, resté invisible jusqu'à l'audit du 05/10.
        run: pnpm audit --audit-level critical

      - name: Avis de dépendances restants (informatif)
        # Les avis « high » et « moderate » sont affichés sans bloquer : les trois qui restent sont
        # dans l'outillage de développement et n'ont aucune version corrigée publiée (DC.2). Cette
        # étape devient bloquante dès qu'ils le sont.
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formatage
        run: pnpm format:check

      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Contrôles (pnpm validate)
        run: pnpm validate

      - name: Installer Chromium pour Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Parcours Playwright + axe
        run: pnpm exec playwright test

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
